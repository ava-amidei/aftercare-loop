<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Aftercare Loop — closing card</title>
<link rel="stylesheet" href="card.css" />
<style>
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 230px; text-align: center; }
  .head { display: flex; align-items: center; gap: 30px; }
  .head img { width: 120px; height: 120px; }
  h1 { font-weight: 700; font-size: 96px; letter-spacing: -0.03em; color: var(--gray-100); }
  .label { margin-top: 50px; font-weight: 700; font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--primary-800); }
  .names { margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; max-width: 1500px; }
  .names .pill { font-size: 32px; }
  .disclaimer { margin-top: 54px; display: inline-flex; border-radius: 9999px; background: var(--secondary); color: var(--gray-100); font-weight: 700; font-size: 30px; padding: 16px 36px; }
</style>
</head>
<body>
<div class="frame">
  <div class="center">
    <div class="head"><img src="logo.svg" alt="Aftercare Loop logo" /><h1>Aftercare Loop</h1></div>
    <p class="label">Built by Team HW1</p>
    <div class="names">
      <span class="pill soft">Stephanie Kim</span>
      <span class="pill soft">Ava Amidei</span>
      <span class="pill soft">Kemigisha Sherifah Muzungu M</span>
      <span class="pill soft">Payton Mendygral</span>
    </div>
    <p class="label">Mentors</p>
    <div class="names">
      <span class="pill primary">Rhea John</span>
      <span class="pill primary">Pavel Stepanov</span>
    </div>
    <p class="disclaimer">Fictional data. Not medical advice.</p>
  </div>
</div>
</body>
</html>
